<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>公开新闻演示站</title></head><body>
<h1>公开新闻演示站</h1><div id="list"></div><button id="next">下一页</button>
<script>
let page=1;
async function load(){
 const response=await fetch(`/api/articles?page=${page}&limit=5`);
 const data=await response.json();
 document.querySelector('#list').innerHTML=data.articles.map(a=>`<p>${a.title} (${a.published_at})</p>`).join('');
}
document.querySelector('#next').addEventListener('click',()=>{page++;load()});
load();
</script></body></html>
