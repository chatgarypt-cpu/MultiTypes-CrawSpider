[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "web-reverse-crawler"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["playwright>=1.48,<2", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
wrc = "wrc.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
