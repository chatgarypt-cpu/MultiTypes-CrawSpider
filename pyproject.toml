[project]
name = "rea-crawlspider"
version = "0.2.3"
description = "自托管网页采集服务，支持任务队列、正文清洗和 CSV 导出"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3",
  "pyyaml>=6,<7",
  "trafilatura>=2.3,<3",
  "curl_cffi>=0.11,<1",   # via: impersonate（Chrome TLS 指纹）；缺省时该出口不可用
  "httpx>=0.27,<1",       # 可选 LLM 结构化提取（crawler/htmlpage.py，未配 key 不参与）
]

[project.optional-dependencies]
browser = [
    "playwright==1.62.0",
    "camoufox==0.5.9",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

# collector/ 是脚本目录（`python collector/collect.py ...`），不是可安装包：
# 顶层模块用 sys.path.insert 定位 crawler/，因此不做打包、不提供 console script。
# 统一入口用 `uv run python collector/cli.py ...` 或 deploy/collectorctl。
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["collector/tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
