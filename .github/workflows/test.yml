name: Crawler regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pipx install --force uv==0.11.7
      - name: Test current tree and upgrade from the published server
        run: |
          set -euo pipefail
          test ! -e collector/sources.yaml
          test "$(cat collector/sources.example.yaml)" = '[]'
          test ! -e backfill_tasks.json
          previous=$(git ls-remote --tags --refs origin 'refs/tags/server-v*' | sed 's|.*refs/tags/||' | grep -E '^server-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          test -n "$previous"
          git fetch --depth=1 origin "refs/tags/$previous"
          export CRAWL_UPGRADE_FROM="$(mktemp -d)"
          git archive FETCH_HEAD | tar -xf - -C "$CRAWL_UPGRADE_FROM"
          bash deploy/verify-server
