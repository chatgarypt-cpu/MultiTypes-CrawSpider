name: Publish server package

on:
  push:
    tags: ['server-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Publish versioned archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git cat-file -p HEAD | grep '^parent '; then
            echo 'The server tag must point to a standalone release snapshot.' >&2
            exit 1
          fi
          test "$(cat collector/sources.yaml)" = '[]'
          package="MultiTypes-CrawSpider-$GITHUB_REF_NAME"
          output="$(mktemp -d)"
          git archive --format=tar.gz --prefix="$package/" --output="$output/$package.tar.gz" HEAD
          (cd "$output" && sha256sum "$package.tar.gz" > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" "$output/$package.tar.gz" "$output/SHA256SUMS" \
            --verify-tag --title "$GITHUB_REF_NAME" --notes-file deploy/server-release.md
