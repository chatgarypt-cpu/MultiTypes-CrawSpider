name: Publish server package

on:
  push:
    branches: ['deploy/centos8']
    tags: ['server-v*']
    paths: ['.github/workflows/publish-server.yml', 'pyproject.toml']

concurrency:
  group: publish-server-package
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pipx install --force uv==0.11.7
      - name: Verify server snapshot and upgrade
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ "$GITHUB_REF_TYPE" == branch ]]; then
            version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
            tag="server-v$version"
            git fetch --depth=1 origin "refs/tags/$tag"
            git switch --detach FETCH_HEAD
          fi
          if git cat-file -p HEAD | grep '^parent '; then
            echo 'The server tag must point to a standalone release snapshot.' >&2
            exit 1
          fi
          test "$(cat collector/sources.yaml)" = '[]'
          versions=$(git ls-remote --tags --refs origin 'refs/tags/server-v*' | sed 's|.*refs/tags/||' | grep -E '^server-v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          previous=$(awk -v target="$tag" '$0 == target {print last; exit} {last=$0}' <<< "$versions")
          test -n "$previous"
          git fetch --depth=1 origin "refs/tags/$previous"
          export CRAWL_UPGRADE_FROM="$(mktemp -d)"
          git archive FETCH_HEAD | tar -xf - -C "$CRAWL_UPGRADE_FROM"
          bash deploy/verify-server --release
          echo "SERVER_TAG=$tag" >> "$GITHUB_ENV"
      - name: Publish verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$SERVER_TAG"
          package="MultiTypes-CrawlSpider-$tag"
          output="$(mktemp -d)"
          git archive --format=tar.gz --prefix="$package/" --output="$output/$package.tar.gz" HEAD
          (cd "$output" && sha256sum "$package.tar.gz" > SHA256SUMS)
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" "$output/$package.tar.gz" "$output/SHA256SUMS" \
              --verify-tag --title "$tag" --notes-file deploy/server-release.md
          fi
